[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-rag-intelligence"
version = "0.1.0"
description = "Enterprise Knowledge Intelligence Platform: secure, evaluated, citation-grounded RAG."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
# Compatibility ranges; see README "Tested versions" for exact verified versions.
dependencies = [
    "pydantic>=2.14,<3",
    "pypdf>=6.0,<7",
    "python-docx>=1.2,<2",
    "tokenizers>=0.21,<1",
    "SQLAlchemy>=2.0,<2.1",
    "alembic>=1.16,<2",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.10,<3",
    "uuid6>=2025.0.1,<2026",
    # Phase 3: embeddings and vector index. Install CPU-only torch first to avoid CUDA
    # wheels: pip install torch --index-url https://download.pytorch.org/whl/cpu
    "torch>=2.6",
    "sentence-transformers>=6.2,<7",
    # Keep the client on the Qdrant server's minor version (docker-compose: v1.18.3).
    "qdrant-client>=1.18,<1.19",
    "httpx>=0.27,<1",
]

[project.scripts]
kip = "kip.cli:main"
kip-worker = "kip.worker.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "ruff>=0.15",
    "mypy>=2.0",
]

[tool.setuptools.packages.find]
where = [".", "apps/api/src"]
include = ["rag*", "kip*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "model: requires downloading a Hugging Face tokenizer/model (network on first run)",
    "postgres: requires TEST_DATABASE_URL pointing at a disposable PostgreSQL database",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PTH", "PL"]
ignore = ["PLR0913", "PLR0917", "PLR2004", "PLR0912", "PLR0915"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["rag", "kip"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["docx.*"]
ignore_missing_imports = true
